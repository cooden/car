        ];

        let currentFilter = '全部';

        function filterBy(f) {
            currentFilter = f;
            document.querySelectorAll('#filter-bar .filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            render();
        }

        function render() {
            const body = document.getElementById('lib-body');
            const list = libData.filter(c => {
                if (currentFilter === '全部') return true;
                if (currentFilter === '新能源') return ['纯电', '插混', '增程', '油混'].includes(c.power);
                return c.level === currentFilter;
            });
            body.innerHTML = list.map(c => {
                const tags = c.tags.map(t => `<span class="tag">${t}</span>`).join('');
                return `
                <tr>
                    <td class="brand-cell">${c.brand} · ${c.model}</td>
                    <td><span class="tag green">${c.level}</span></td>
                    <td>${c.power}</td>
                    <td>${c.price}</td>
                    <td>${tags}</td>
                    <td class="links-cell"><a href="${c.links}">查看 →</a></td>
                </tr>`;
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', render);
    </script>
