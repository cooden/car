    <div class="content">
        <h1>新车参数对比</h1>
        <div class="picker">
            <div><label>车型一：</label>
                <select id="car-select-1"></select>
            </div>
            <div><label>车型二：</label>
                <select id="car-select-2"></select>
            </div>
        </div>

        <div class="compare-table">
            <table id="compare-table">
                <thead>
                    <tr>
                        <th>参数</th>
                        <th id="col-1-name">车型一</th>
                        <th id="col-2-name">车型二</th>
                    </tr>
                </thead>
                <tbody id="compare-body"></tbody>
            </table>
        </div>

        <div class="tip">
            <strong>对比小贴士：</strong>红色加粗参数表示两款车型存在差异。若两款车价格接近，建议优先比较轴距、能耗与智能配置；家用需求可重点关注空间与舒适性配置，通勤场景则看重能耗与补能效率。
        </div>

        <!-- 广告位 -->
        <div class="ads-container self-ad"><a href="power.html" class="self-ad-link"><span class="self-ad-icon">&#9889;</span><div class="self-ad-text"><div class="self-ad-title">油车电车哪个更省？</div><div class="self-ad-desc">输入油价电价，秒算年度省钱金额</div></div><span class="self-ad-cta">查看 &rarr;</span></a></div>

        <p>买车指南 &copy; 2026 | 数据仅供参考，实际参数以厂商公布为准</p>
    </footer>

    <script>
        const cars = [
            { name: "极氪7X", price: "22.99-29.99万", level: "中型SUV", size: "4830×1930×1669mm", wheelbase: "2930mm", power: "纯电 后驱/四驱", consumption: "约14.5kWh/100km", accel: "4.5s", tech: "浩瀚智驾2.0/800V快充/AR-HUD" },
            { name: "领克900", price: "30.99-36.99万", level: "中大型SUV", size: "5230×1999×1810mm", wheelbase: "3160mm", power: "插混 1.5T+电机", consumption: "亏电约6.9L/100km", accel: "5.2s", tech: "EM-P超电混动/高阶智驾/空气悬架" },
            { name: "腾势N9", price: "38.98-44.98万", level: "大型SUV", size: "5258×2030×1830mm", wheelbase: "3125mm", power: "插混 易三方四驱", consumption: "亏电约7.2L/100km", accel: "4.9s", tech: "易三方泊车/云辇-A/天神之眼" },
            { name: "问界M7", price: "24.98-31.98万", level: "中大型SUV", size: "5020×1945×1760mm", wheelbase: "2820mm", power: "增程 1.5T", consumption: "亏电约6.6L/100km", accel: "7.8s", tech: "华为ADS 3.0/鸿蒙座舱/零重力座椅" },
            { name: "理想L7", price: "28.98-35.98万", level: "中大型SUV", size: "5050×1995×1750mm", wheelbase: "3005mm", power: "增程 1.5T", consumption: "亏电约7.4L/100km", accel: "5.3s", tech: "理想AD Max/魔毯空气悬架/大床模式" },
            { name: "小鹏G9", price: "26.99-35.99万", level: "中大型SUV", size: "4891×1937×1670mm", wheelbase: "2998mm", power: "纯电 后驱/四驱", consumption: "约15.2kWh/100km", accel: "3.9s", tech: "XNGP全场景智驾/800V超快充/5D音乐座舱" },
            { name: "蔚来ES6", price: "33.80-39.60万", level: "中型SUV", size: "4854×1995×1703mm", wheelbase: "2915mm", power: "纯电 双电机四驱", consumption: "约17.3kWh/100km", accel: "4.5s", tech: "换电服务/NOMI智能交互/NIO Pilot" },
            { name: "唐DM-i", price: "21.98-29.98万", level: "中型SUV", size: "4870×1950×1725mm", wheelbase: "2820mm", power: "插混 1.5T", consumption: "亏电约5.9L/100km", accel: "8.5s", tech: "DM-i超混/7座布局/DiLink智能网联" },
            { name: "汉兰达", price: "31.98-39.98万", level: "中大型SUV", size: "4965×1930×1750mm", wheelbase: "2850mm", power: "油混 2.5L", consumption: "约5.8L/100km", accel: "8.3s", tech: "丰田THS混动/TSS智行安全/保值率高" },
            { name: "途观L Pro", price: "26.68-29.68万", level: "中型SUV", size: "4735×1859×1682mm", wheelbase: "2791mm", power: "燃油 2.0T", consumption: "约8.4L/100km", accel: "7.5s", tech: "IQ.Drive智驾/12.3寸双联屏/德系操控" }
        ];

        const rows = [
            { label: "价格区间", key: "price" },
            { label: "级别", key: "level" },
            { label: "车身尺寸", key: "size" },
            { label: "轴距", key: "wheelbase" },
            { label: "动力类型", key: "power" },
            { label: "能耗", key: "consumption" },
            { label: "0-100km/h", key: "accel" },
            { label: "智能配置", key: "tech" }
        ];

        const select1 = document.getElementById('car-select-1');
        const select2 = document.getElementById('car-select-2');

        cars.forEach((car, i) => {
            select1.add(new Option(car.name, i));
            select2.add(new Option(car.name, i));
        });
        select2.selectedIndex = 1;

        function render() {
            const c1 = cars[select1.value];
            const c2 = cars[select2.value];
            document.getElementById('col-1-name').textContent = c1.name;
            document.getElementById('col-2-name').textContent = c2.name;
            const tbody = document.getElementById('compare-body');
            tbody.innerHTML = '';
            rows.forEach(row => {
                const tr = document.createElement('tr');
                const isDiff = c1[row.key] !== c2[row.key];
                tr.innerHTML = `
                    <td>${row.label}</td>
                    <td class="${isDiff ? 'diff' : ''}">${c1[row.key]}</td>
                    <td class="${isDiff ? 'diff' : ''}">${c2[row.key]}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        select1.addEventListener('change', render);
        select2.addEventListener('change', render);
        render();
    </script>
</body>
