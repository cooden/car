<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>20-50万SUV车型排行</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        .navbar {
            background-color: #333;
            overflow: hidden;
        }
        .navbar a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }
        .navbar a:hover {
            background-color: #ddd;
            color: black;
        }
        .content {
            padding: 20px;
            text-align: center;
        }
        .car-ranking-container {
            padding-bottom: 20px;
        }
        .car-ranking {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px 0;
            align-items: center; /* 居中对齐 */
        }
        .car-card {
            width: 80%; /* 调整宽度以适应竖向排列 */
            max-width: 400px; /* 设置最大宽度 */
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 15px;
            text-align: center;
        }
        .car-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .car-name {
            font-weight: bold;
            margin: 5px 0;
            white-space: normal;
        }
        .car-price {
            color: #e74c3c;
            font-size: 18px;
        }
        .car-brand {
            color: #7f8c8d;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="#">首页</a>
        <a href="#">比亚迪</a>
        <a href="#">吉利</a>
        <a href="#">极氪</a>
        <a href="#">腾势</a>
    </div>
    <div class="content">
        <h1>20-50万SUV车型排行</h1>
        <div class="car-ranking-container">
            <div class="car-ranking" id="car-ranking-list">
                <!-- 车型卡片将通过JavaScript动态加载 -->
            </div>
        </div>
    </div>

    <script>
        const carData = [
            {
                "品牌": "吉利",
                "子品牌": "极氪",
                "车型": "极氪7X",
                "最低配车型": "2025款 后驱智驾版75kWh",
                "官方指导价": "22.99万",
                "image": "极氪mix.jpg" // 示例图片，请替换为实际图片
            },
            {
                "品牌": "吉利",
                "子品牌": "极氪",
                "车型": "极氪MIX",
                "最低配车型": "2025款 76kWh 智驾版",
                "官方指导价": "27.99万",
                "image": "极氪mix.jpg"
            },
            {
                "品牌": "吉利",
                "子品牌": "吉利",
                "车型": "领克900",
                "最低配车型": "2025款 1.5T Halo（官方指导价）",
                "官方指导价": "30.99万",
                "image": "900.png"
            },
            {
                "品牌": "比亚迪",
                "子品牌": "腾势",
                "车型": "腾势N9",
                "最低配车型": "2025款 易三方插混1300尊荣型",
                "官方指导价": "38.98万",
                "image": "n9.png" 
            }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const carRankingList = document.getElementById('car-ranking-list');
            carData.forEach(car => {
                const carCard = document.createElement('div');
                carCard.classList.add('car-card');
                carCard.innerHTML = `
                    <img src="${car.image}" alt="${car.车型}" class="car-image">
                    <div class="car-name">${car.车型}</div>
                    <div class="car-brand">${car.品牌} - ${car.子品牌}</div>
                    <div class="car-price">${car.官方指导价}起</div>
                `;
                carRankingList.appendChild(carCard);
            });
        });
    </script>
</body>
</html>
